<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tmo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f0f;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 1.5rem;
    padding: 2rem;
    text-align: center;
  }
  .logo { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; }
  .sub  { font-size: 1rem; opacity: 0.5; }
  .dot  {
    width: 8px; height: 8px; border-radius: 50%;
    background: #e0441a;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.3; transform: scale(0.7); }
  }
</style>
</head>
<body>
<div class="logo">tmo</div>
<div class="dot"></div>
<div class="sub">Loading the Melbourne gig guide…</div>
<script>
// Mirror Python's resolve_monday(): date - timedelta(days=date.weekday())
// weekday(): Mon=0, Tue=1, ..., Sun=6
// JS getDay():  Sun=0, Mon=1, ..., Sat=6
// Days since Monday in JS: (jsWeekday + 6) % 7
function getMelbourneMonday() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-CA', { timeZone: 'Australia/Melbourne' });
  const jsWd = new Date(dateStr + 'T12:00:00').getDay();
  const daysSinceMon = (jsWd + 6) % 7;
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() - daysSinceMon);
  return d.toISOString().slice(0, 10);
}

// Staging builds (applicationId ends in .staging) load the React rebuild from
// its own Cloudflare Worker; production builds load the live gig guide.
// Plain-web visitors (no bridge) fall through to production.
async function resolveTargetUrl() {
  let staging = false;
  try {
    // This static page bundles no Capacitor runtime, so window.Capacitor.Plugins
    // is undefined here — call the App plugin through the injected native
    // bridge's low-level transport instead.
    const info = await window.Capacitor.nativePromise('App', 'getInfo', {});
    staging = (info.id || '').endsWith('.staging');
  } catch (e) { /* bridge absent (plain web) or plugin error — production */ }
  // The staging React app resolves the current week itself, so the URL
  // carries no date — unlike the static production gig guide.
  if (staging) return 'https://staging.tmo.cool/';
  const monday = getMelbourneMonday();
  return 'https://nmwoods1.github.io/deepnorth/gigs-' + monday + '.html';
}

resolveTargetUrl().then(url => window.location.replace(url));
</script>
</body>
</html>
